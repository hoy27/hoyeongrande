name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Upcoming/Past 분류를 날짜에 맞게 갱신하려고 매일 한 번 다시 빌드한다 (한국 시간 00:05).
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Settings → Secrets and variables → Actions → Variables 의 GA_ID
      PUBLIC_GA_ID: ${{ vars.GA_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
